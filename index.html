<dialog id="dlg"><form method="dialog" id="dform" onsubmit="return false"><div class="dh"><b id="dtitle"></b><button type="button" class="btn sm" onclick="closeModal()">✕</button></div><div class="db" id="dbody"></div><div class="df" id="dfoot"></div></form></dialog>

<script>
/* =====================================================================
   LUBRICENTRO MAXI · Sistema de Stock y Trazabilidad (demo HTML5)
   Datos en localStorage. Modelo equivalente a schema.sql.
   Desarrollado por VINCULAR BUSINESS · (387) 4484132 · vincularbusiness@gmail.com
   ===================================================================== */
const LS='lubricentro_maxi_v1';
let DB=null;

/* ---------- utilidades ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r3=n=>Math.round((n+Number.EPSILON)*1000)/1000;
const money=n=>new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS',maximumFractionDigits:0}).format(n||0);
const num=n=>new Intl.NumberFormat('es-AR',{maximumFractionDigits:3}).format(n||0);
const z2=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+z2(d.getMonth()+1)+'-'+z2(d.getDate());
const hoy=()=>ymd(new Date());
const addDays=n=>{const d=new Date();d.setDate(d.getDate()+n);return ymd(d)};
const diffDays=(a,b)=>Math.round((new Date(a+'T00:00:00')-new Date(b+'T00:00:00'))/864e5);
const nowIso=()=>{const d=new Date();return ymd(d)+'T'+z2(d.getHours())+':'+z2(d.getMinutes())};
const fdate=s=>s?s.slice(8,10)+'/'+s.slice(5,7)+'/'+s.slice(0,4):'—';
const fdt=s=>s?fdate(s)+(s.length>10?' '+s.slice(11,16):''):'—';
const nextId=t=>{DB.seq[t]=(DB.seq[t]||0)+1;return DB.seq[t]};
const byId=(arr,id)=>arr.find(x=>x.id===Number(id));
function save(){try{localStorage.setItem(LS,JSON.stringify(DB))}catch(e){console.warn(e)}}
function toast(msg,err){const d=document.createElement('div');if(err)d.className='err';d.textContent=msg;$('#toast').appendChild(d);setTimeout(()=>d.remove(),err?6000:3500)}
function downloadCsv(name,headers,rows){
  const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
  const txt='\ufeff'+[headers.map(q).join(';'),...rows.map(r=>r.map(q).join(';'))].join('\r\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'text/csv;charset=utf-8'}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}

/* ---------- modal ---------- */
function openModal(title,body,onSubmit,label){
  $('#dtitle').textContent=title;$('#dbody').innerHTML=body;
  $('#dfoot').innerHTML='<button type="button" class="btn" onclick="closeModal()">'+(onSubmit?'Cancelar':'Cerrar')+'</button>'+(onSubmit?'<button type="submit" class="btn pri">'+esc(label||'Guardar')+'</button>':'');
  $('#dform').onsubmit=e=>{e.preventDefault();if(!onSubmit)return false;
    try{const r=onSubmit(Object.fromEntries(new FormData($('#dform'))));if(r!==false)closeModal()}catch(err){toast(err.message,true)}return false};
  const d=$('#dlg');if(!d.open)d.showModal();
}
function closeModal(){const d=$('#dlg');if(d.open)d.close()}

/* =====================================================================
   NÚCLEO DE NEGOCIO (stock por lote, FIFO/FEFO, trazabilidad)
   El stock NO se guarda: se calcula sumando el libro de movimientos.
   ===================================================================== */
function stockMap(){const m={};DB.movimientos.forEach(x=>{m[x.loteId]=r3((m[x.loteId]||0)+x.cant)});return m}
function estadoVenc(l){
  if(!l.venc)return'sin';
  const d=diffDays(l.venc,hoy());
  if(d<0)return'vencido';
  return d<=DB.cfg.diasAlerta?'proximo':'ok';
}
function ordenarLotes(lotes,crit){
  return lotes.slice().sort((a,b)=>{
    if(crit==='FEFO'){const av=a.venc||'9999-12-31',bv=b.venc||'9999-12-31';if(av!==bv)return av<bv?-1:1}
    if(a.ingreso!==b.ingreso)return a.ingreso<b.ingreso?-1:1;
    return a.id-b.id;
  });
}
/* Lotes vendibles de un producto: con stock, no vencidos, ordenados por criterio */
function lotesVendibles(prodId,sm){
  sm=sm||stockMap();
  return ordenarLotes(DB.lotes.filter(l=>l.productoId===prodId&&(sm[l.id]||0)>0&&estadoVenc(l)!=='vencido'),DB.cfg.criterio);
}
/* Asigna cantidad a lotes (muta sm para poder encadenar renglones). Lanza error si no alcanza. */
function asignar(prodId,cant,loteId,sm){
  const p=byId(DB.productos,prodId);
  if(!(cant>0))throw new Error('Cantidad inválida para '+p.nombre);
  const disp=lotesVendibles(prodId,sm);
  if(loteId){
    const l=disp.find(x=>x.id===Number(loteId));
    if(!l)throw new Error('El lote elegido no está disponible (sin stock o vencido) para '+p.nombre);
    if(sm[l.id]<cant)throw new Error('El lote '+l.nro+' sólo tiene '+num(sm[l.id])+' '+p.unidad+' de '+p.nombre);
    sm[l.id]=r3(sm[l.id]-cant);return[{loteId:l.id,cant}];
  }
  let rest=cant;const out=[];
  for(const l of disp){
    const t=Math.min(rest,sm[l.id]);out.push({loteId:l.id,cant:r3(t)});sm[l.id]=r3(sm[l.id]-t);rest=r3(rest-t);if(rest<=0)break;
  }
  if(rest>0)throw new Error('Stock insuficiente de '+p.nombre+': faltan '+num(rest)+' '+p.unidad+' (los lotes vencidos no se venden)');
  return out;
}
const stockFisico=(pid,sm)=>DB.lotes.filter(l=>l.productoId===pid).reduce((s,l)=>s+(sm[l.id]||0),0);
const stockDisp=(pid,sm)=>r3(DB.lotes.filter(l=>l.productoId===pid&&estadoVenc(l)!=='vencido').reduce((s,l)=>s+(sm[l.id]||0),0));
const stockVencido=(pid,sm)=>r3(DB.lotes.filter(l=>l.productoId===pid&&estadoVenc(l)==='vencido').reduce((s,l)=>s+(sm[l.id]||0),0));

function pushMov(m){DB.movimientos.push({id:nextId('mov'),fecha:m.fecha||nowIso(),tipo:m.tipo,loteId:m.loteId,productoId:m.productoId,cant:r3(m.cant),costo:m.costo||0,refTipo:m.refTipo||'',refId:m.refId||0,nota:m.nota||''})}

/* COMPRA: crea cabecera, renglones, lotes y movimientos ENTRADA (todo o nada) */
function crearCompra(c){
  if(!c.proveedorId)throw new Error('Elegí un proveedor');
  if(!c.numero||!c.numero.trim())throw new Error('Ingresá el número de remito/factura');
  if(!c.items.length)throw new Error('Agregá al menos un renglón');
  const dup=DB.compras.find(x=>x.proveedorId===Number(c.proveedorId)&&x.tipo===c.tipo&&x.numero.trim().toLowerCase()===c.numero.trim().toLowerCase());
  if(dup)throw new Error('Ese comprobante ya fue cargado para este proveedor (compra #'+dup.id+')');
  const snap=JSON.stringify(DB);
  try{
    const compra={id:nextId('compra'),proveedorId:Number(c.proveedorId),tipo:c.tipo,numero:c.numero.trim(),fecha:c.fecha||hoy(),obs:c.obs||'',total:0};
    DB.compras.push(compra);
    c.items.forEach(it=>{
      const p=byId(DB.productos,it.productoId);
      if(!(it.cant>0))throw new Error('Cantidad inválida en '+p.nombre);
      if(!(it.costo>=0))throw new Error('Costo inválido en '+p.nombre);
      if(!it.nro||!it.nro.trim())throw new Error('Falta el N° de lote de '+p.nombre);
      if(p.controlaVenc&&!it.venc)throw new Error('Falta la fecha de vencimiento de '+p.nombre);
      const nro=it.nro.trim();const venc=it.venc||'';
      let lote=DB.lotes.find(l=>l.productoId===p.id&&l.nro.toLowerCase()===nro.toLowerCase());
      if(lote){
        if((lote.venc||'')!==venc)throw new Error('El lote '+nro+' de '+p.nombre+' ya existe con otro vencimiento ('+fdate(lote.venc)+')');
      }else{
        lote={id:nextId('lote'),productoId:p.id,nro,venc,ingreso:compra.fecha,compraId:compra.id,proveedorId:compra.proveedorId,cantInicial:0,costo:it.costo};
        DB.lotes.push(lote);
      }
      lote.cantInicial=r3(lote.cantInicial+it.cant);
      // costo del lote = promedio ponderado si se completa un lote existente
      DB.compraItems.push({id:nextId('compraItem'),compraId:compra.id,productoId:p.id,loteId:lote.id,cant:it.cant,costo:it.costo});
      compra.total+=it.cant*it.costo;
      pushMov({fecha:compra.fecha+'T09:00',tipo:'ENTRADA',loteId:lote.id,productoId:p.id,cant:it.cant,costo:it.costo,refTipo:'compra',refId:compra.id,nota:compra.tipo+' '+compra.numero});
    });
    save();return compra;
  }catch(e){DB=JSON.parse(snap);throw e}
}
/* VENTA: asigna lotes por FEFO/FIFO (o lote elegido), descuenta stock con movimientos VENTA */
function crearVenta(v){
  if(!v.items.length)throw new Error('El carrito está vacío');
  const sm=stockMap();const plan=v.items.map(it=>({...it,allocs:asignar(it.productoId,it.cant,it.loteId||null,sm)}));
  const venta={id:nextId('venta'),fecha:v.fecha||nowIso(),cliente:(v.cliente||'').trim()||'Consumidor final',medio:v.medio||'Efectivo',total:0};
  DB.ventas.push(venta);
  plan.forEach(it=>{
    const vi={id:nextId('ventaItem'),ventaId:venta.id,productoId:it.productoId,cant:it.cant,precio:it.precio,allocs:[]};
    it.allocs.forEach(a=>{
      const l=byId(DB.lotes,a.loteId);vi.allocs.push({loteId:a.loteId,cant:a.cant,costo:l.costo});
      pushMov({fecha:venta.fecha,tipo:'VENTA',loteId:a.loteId,productoId:it.productoId,cant:-a.cant,costo:l.costo,refTipo:'venta',refId:venta.id,nota:'Ticket #'+venta.id});
    });
    DB.ventaItems.push(vi);venta.total+=it.cant*it.precio;
  });
  save();return venta;
}
/* AJUSTE / SALIDA no comercial */
const TIPOS_MOV={ENTRADA:'Entrada (compra)',VENTA:'Venta',MERMA:'Merma',VENCIDO:'Baja por vencimiento',ROTURA:'Rotura',AJUSTE_POS:'Ajuste (+)',AJUSTE_NEG:'Ajuste (−)'};
function crearAjuste(a){
  const l=byId(DB.lotes,a.loteId);if(!l)throw new Error('Elegí un lote');
  const sm=stockMap();const cant=Number(a.cant);
  if(!(cant>0))throw new Error('Cantidad inválida');
  if(!a.nota||!a.nota.trim())throw new Error('Indicá el motivo del ajuste (queda en la auditoría)');
  const neg=a.tipo!=='AJUSTE_POS';
  if(neg&&cant>(sm[l.id]||0))throw new Error('El lote '+l.nro+' sólo tiene '+num(sm[l.id]||0));
  pushMov({fecha:a.fecha,tipo:a.tipo,loteId:l.id,productoId:l.productoId,cant:neg?-cant:cant,costo:l.costo,refTipo:'ajuste',refId:0,nota:a.nota.trim()});
  save();
}
/* TRAZABILIDAD de un lote: origen + cadena de movimientos con saldo corrido */
function trazar(loteId){
  const l=byId(DB.lotes,loteId);if(!l)return null;
  const p=byId(DB.productos,l.productoId),prov=byId(DB.proveedores,l.proveedorId),c=byId(DB.compras,l.compraId);
  let saldo=0;
  const movs=DB.movimientos.filter(m=>m.loteId===l.id).sort((a,b)=>a.fecha<b.fecha?-1:a.fecha>b.fecha?1:a.id-b.id).map(m=>{saldo=r3(saldo+m.cant);return{...m,saldo}});
  return{lote:l,prod:p,prov,compra:c,movs,saldo};
}
/* ALERTAS */
function calcAlertas(){
  const sm=stockMap();const out={criticos:[],reorden:[],proximos:[],vencidos:[]};
  DB.productos.filter(p=>p.activo).forEach(p=>{
    const d=stockDisp(p.id,sm);
    if(d<=p.stockMin)out.criticos.push({p,stock:d});
    else if(d<=p.puntoReorden)out.reorden.push({p,stock:d});
  });
  DB.lotes.forEach(l=>{
    const s=sm[l.id]||0;if(s<=0)return;const p=byId(DB.productos,l.productoId);const e=estadoVenc(l);
    if(e==='proximo')out.proximos.push({l,p,stock:s,dias:diffDays(l.venc,hoy())});
    if(e==='vencido')out.vencidos.push({l,p,stock:s,dias:diffDays(l.venc,hoy())});
  });
  out.proximos.sort((a,b)=>a.dias-b.dias);out.vencidos.sort((a,b)=>a.dias-b.dias);
  out.criticos.sort((a,b)=>a.stock-b.stock);
  return out;
}
const totalAlertas=a=>a.criticos.length+a.proximos.length+a.vencidos.length;
function valorizacion(){
  const sm=stockMap();
  return DB.lotes.filter(l=>(sm[l.id]||0)>0).map(l=>({l,p:byId(DB.productos,l.productoId),stock:sm[l.id],valor:r3(sm[l.id]*l.costo),estado:estadoVenc(l)}));
}

/* =====================================================================
   DATOS DE DEMO
   ===================================================================== */
function seed(){
  DB={cfg:{criterio:'FEFO',diasAlerta:60,nombre:'Lubricentro Maxi'},seq:{},
    categorias:['Aceites','Filtros','Aditivos','Refrigerantes','Líquidos de freno','Grasas','Limpieza'],
    unidades:['Un','Lt','Kg','Bidón','Pack'],
    productos:[],proveedores:[],compras:[],compraItems:[],lotes:[],movimientos:[],ventas:[],ventaItems:[]};
  const prov=(razon,cuit,contacto,tel,email,dir,notas)=>{const p={id:nextId('prov'),razon,cuit,contacto,tel,email,dir,notas,activo:true};DB.proveedores.push(p);return p.id};
  const P1=prov('Lubrimax Distribuciones SRL','30-71234567-8','Marcelo Quiroga','387 4556677','ventas@lubrimax.example','Av. Bolivia 2450, Salta','Aceites y grasas · entrega martes y viernes');

function bajaProducto(id){
  const p=byId(DB.productos,id),tieneMov=DB.movimientos.some(m=>m.productoId===id);

  const s=stockDisp(id,stockMap());
  if(s>0&&!confirm('Tiene '+num(s)+' '+p.unidad+' en stock. Se da de baja igual (no se podrá vender) pero el historial se conserva. ¿Seguir?'))return;
  p.activo=false;save();toast('Producto dado de baja (se conserva el historial)');render();
}

R.inventario=()=>{
  const sm=stockMap(),t=tabs.inventario,f=flt.inv;
  const tb='<div class="tabs"><button class="'+(t==='producto'?'on':'')+'" onclick="tabs.inventario=\'producto\';render()">Por producto</button><button class="'+(t==='lote'?'on':'')+'" onclick="tabs.inventario=\'lote\';render()">Por lote</button></div>';
  const q=f.q.toLowerCase();
  const bar='<div class="bar"><input id="iq" placeholder="Buscar producto, código o lote…" value="'+esc(f.q)+'" oninput="flt.inv.q=this.value;rerender(\'inventario\',\'iq\')" style="min-width:240px">'+
   (t==='lote'?'<select onchange="flt.inv.estado=this.value;render()"><option value="">Todos los estados</option><option value="ok"'+(f.estado==='ok'?' selected':'')+'>Vigentes</option><option value="proximo"'+(f.estado==='proximo'?' selected':'')+'>Por vencer</option><option value="vencido"'+(f.estado==='vencido'?' selected':'')+'>Vencidos</option><option value="sin"'+(f.estado==='sin'?' selected':'')+'>Sin vencimiento</option></select><label class="small mut"><input type="checkbox" '+(f.soloStock?'checked':'')+' onchange="flt.inv.soloStock=this.checked;render()"> sólo con stock</label>':'')+'</div>';
  if(t==='producto'){
    const rows=DB.productos.filter(p=>p.activo&&(!q||(p.nombre+p.codigo+p.marca).toLowerCase().includes(q))).map(p=>{
      const ls=ordenarLotes(DB.lotes.filter(l=>l.productoId===p.id&&(sm[l.id]||0)>0),DB.cfg.criterio);const d=stockDisp(p.id,sm);const prox=lotesVendibles(p.id,sm)[0];
      return'<tr><td><b>'+esc(p.nombre)+'</b><div class="mut small">'+esc(p.codigo)+'</div></td><td class="r"><b>'+num(d)+'</b> '+esc(p.unidad)+'</td><td class="r">'+ls.length+'</td><td>'+(prox?esc(prox.nro)+' '+badgeVenc(prox):'<span class="mut">—</span>')+'</td><td class="r">'+money(ls.reduce((s,l)=>s+sm[l.id]*l.costo,0))+'</td><td class="act"><button class="btn sm" onclick="flt.inv.q=\''+esc(p.codigo)+'\';tabs.inventario=\'lote\';render()">Ver lotes</button></td></tr>'});
    return head('Inventario','Stock disponible por producto y próximo lote que saldrá según '+DB.cfg.criterio)+tb+bar+'<div class="card wrap"><table class="tbl"><tr><th>Producto</th><th class="r">Disponible</th><th class="r">Lotes c/stock</th><th>Sale primero ('+DB.cfg.criterio+')</th><th class="r">Valor</th><th></th></tr>'+rows.join('')+'</table></div>';
  }
  let ls=DB.lotes.filter(l=>{const p=byId(DB.productos,l.productoId);return(!q||(p.nombre+p.codigo+l.nro).toLowerCase().includes(q))&&(!f.estado||estadoVenc(l)===f.estado)&&(!f.soloStock||(sm[l.id]||0)>0)});
  ls=ls.sort((a,b)=>a.productoId-b.productoId||(ordenarLotes([a,b],DB.cfg.criterio)[0]===a?-1:1));
  return head('Inventario por lote','Cada lote conserva su vencimiento, proveedor y costo')+tb+bar+'<div class="card wrap"><table class="tbl"><tr><th>Producto</th><th>Lote</th><th>Ingreso</th><th>Vencimiento</th><th>Proveedor</th><th class="r">Inicial</th><th class="r">Stock</th><th class="r">Costo</th><th class="r">Valor</th><th></th></tr>'+
   (ls.length?ls.map(l=>{const p=byId(DB.productos,l.productoId),pv=byId(DB.proveedores,l.proveedorId),s=sm[l.id]||0;return'<tr><td>'+esc(p.nombre)+'</td><td><b>'+esc(l.nro)+'</b></td><td>'+fdate(l.ingreso)+'</td><td>'+badgeVenc(l)+'</td><td class="small">'+esc(pv.razon)+'</td><td class="r">'+num(l.cantInicial)+'</td><td class="r"><b>'+num(s)+'</b></td><td class="r">'+money(l.costo)+'</td><td class="r">'+money(s*l.costo)+'</td><td class="act"><button class="btn sm" onclick="trazarLote('+l.id+')">Trazar</button> <button class="btn sm" onclick="formAjuste('+l.id+')">Ajustar</button></td></tr>'}).join(''):'<tr><td colspan="10" class="empty">Sin lotes</td></tr>')+'</table></div>';
};

/* ---------- Proveedores ---------- */
R.proveedores=()=>{
  return head('Proveedores','Datos de contacto y compras asociadas')+'<div class="bar"><div class="sp"></div><button class="btn pri" onclick="formProv()">+ Nuevo proveedor</button></div>'+
  '<div class="card wrap"><table class="tbl"><tr><th>Razón social</th><th>CUIT</th><th>Contacto</th><th>Teléfono / email</th><th>Dirección</th><th class="r">Compras</th><th>Estado</th><th></th></tr>'+
  DB.proveedores.map(p=>{const n=DB.compras.filter(c=>c.proveedorId===p.id).length;return'<tr><td><b>'+esc(p.razon)+'</b><div class="mut small">'+esc(p.notas)+'</div></td><td>'+esc(p.cuit)+'</td><td>'+esc(p.contacto)+'</td><td>'+esc(p.tel)+'<div class="small mut">'+esc(p.email)+'</div></td><td class="small">'+esc(p.dir)+'</td><td class="r">'+n+'</td><td>'+(p.activo?'<span class="badge b-ok">Activo</span>':'<span class="badge b-mut">Inactivo</span>')+'</td><td class="act"><button class="btn sm" onclick="formProv('+p.id+')">Editar</button> <button class="btn sm danger" onclick="bajaProv('+p.id+')">'+(p.activo?'Baja':'Reactivar')+'</button></td></tr>'}).join('')+'</table></div>';
};
function formProv(id){
  const p=id?byId(DB.proveedores,id):{razon:'',cuit:'',contacto:'',tel:'',email:'',dir:'',notas:''};
  openModal(id?'Editar proveedor':'Nuevo proveedor','<div class="form"><label class="full">Razón social *<input name="razon" required value="'+esc(p.razon)+'"></label><label>CUIT<input name="cuit" value="'+esc(p.cuit)+'"></label><label>Persona de contacto<input name="contacto" value="'+esc(p.contacto)+'"></label><label>Teléfono<input name="tel" value="'+esc(p.tel)+'"></label><label>Email<input name="email" type="email" value="'+esc(p.email)+'"></label><label class="full">Dirección<input name="dir" value="'+esc(p.dir)+'"></label><label class="full">Notas (rubros, días de entrega…)<textarea name="notas" rows="2">'+esc(p.notas)+'</textarea></label></div>',
   d=>{if(id)Object.assign(byId(DB.proveedores,id),d);else DB.proveedores.push({id:nextId('prov'),activo:true,...d});save();toast('Proveedor guardado');render()});
}
function bajaProv(id){const p=byId(DB.proveedores,id);
  if(p.activo&&!DB.compras.some(c=>c.proveedorId===id)){if(confirm('Eliminar proveedor sin compras?')){DB.proveedores=DB.proveedores.filter(x=>x.id!==id)}}else p.activo=!p.activo;save();render()}

/* ---------- Compras ---------- */
function newDraft(){draft={proveedorId:'',tipo:'Remito',numero:'',fecha:hoy(),obs:'',items:[]}}
R.compras=()=>{
  const t=tabs.compras;if(!draft)newDraft();
  const tb='<div class="tabs"><button class="'+(t==='nueva'?'on':'')+'" onclick="tabs.compras=\'nueva\';render()">Ingresar remito / factura</button><button class="'+(t==='hist'?'on':'')+'" onclick="tabs.compras=\'hist\';render()">Historial</button></div>';
  if(t==='hist'){
    const rows=DB.compras.slice().sort((a,b)=>b.fecha<a.fecha?-1:b.fecha>a.fecha?1:b.id-a.id);
    return head('Compras','Cada comprobante queda vinculado a los lotes que generó')+tb+'<div class="card wrap"><table class="tbl"><tr><th>#</th><th>Fecha</th><th>Proveedor</th><th>Comprobante</th><th class="r">Renglones</th><th class="r">Total</th><th></th></tr>'+
     rows.map(c=>'<tr><td>'+c.id+'</td><td>'+fdate(c.fecha)+'</td><td>'+esc(byId(DB.proveedores,c.proveedorId).razon)+'</td><td>'+esc(c.tipo)+' '+esc(c.numero)+'</td><td class="r">'+DB.compraItems.filter(i=>i.compraId===c.id).length+'</td><td class="r">'+money(c.total)+'</td><td class="act"><button class="btn sm" onclick="verCompra('+c.id+')">Detalle</button></td></tr>').join('')+'</table></div>';
  }
  const d=draft;
  return head('Ingreso de compra','Cargá el comprobante y, por cada renglón, el lote y su vencimiento. Al confirmar se crean los lotes y entra el stock.')+tb+
  '<div class="card"><div class="form"><label>Proveedor *<select onchange="draft.proveedorId=this.value"><option value="">— elegir —</option>'+DB.proveedores.filter(p=>p.activo).map(p=>'<option value="'+p.id+'"'+(Number(d.proveedorId)===p.id?' selected':'')+'>'+esc(p.razon)+'</option>').join('')+'</select></label>'+
  '<label>Tipo<select onchange="draft.tipo=this.value">'+['Remito','Factura A','Factura B','Factura C','Factura X'].map(x=>'<option'+(d.tipo===x?' selected':'')+'>'+x+'</option>').join('')+'</select></label>'+
  '<label>N° comprobante *<input value="'+esc(d.numero)+'" placeholder="0001-00001234" oninput="draft.numero=this.value"></label><label>Fecha<input type="date" value="'+d.fecha+'" max="'+hoy()+'" onchange="draft.fecha=this.value"></label></div></div>'+
  '<div class="card"><h2>Agregar renglón</h2><div class="form" id="lineForm"><label class="full">Producto<select id="l_prod" onchange="lineProdChange()"><option value="">— elegir —</option>'+optsProd('')+'</select></label>'+
  '<label>N° de lote *<input id="l_nro" placeholder="L25-0301"></label><label>Vencimiento<input id="l_venc" type="date"></label><label>Cantidad *<input id="l_cant" type="number" min="0" step="any"></label><label>Costo unitario ($) *<input id="l_costo" type="number" min="0" step="any"></label></div>'+
  '<div style="margin-top:10px"><button class="btn pri" onclick="addLine()">+ Agregar al comprobante</button></div></div>'+
  '<div class="card"><h2>Renglones ('+d.items.length+')</h2>'+(d.items.length?'<div class="wrap"><table class="tbl"><tr><th>Producto</th><th>Lote</th><th>Vence</th><th class="r">Cant.</th><th class="r">Costo</th><th class="r">Subtotal</th><th></th></tr>'+
   d.items.map((it,i)=>{const p=byId(DB.productos,it.productoId);return'<tr><td>'+esc(p.nombre)+'</td><td>'+esc(it.nro)+'</td><td>'+fdate(it.venc)+'</td><td class="r">'+num(it.cant)+' '+esc(p.unidad)+'</td><td class="r">'+money(it.costo)+'</td><td class="r">'+money(it.cant*it.costo)+'</td><td class="act"><button class="btn sm danger" onclick="draft.items.splice('+i+',1);render()">Quitar</button></td></tr>'}).join('')+
   '<tr><td colspan="5" class="r"><b>Total</b></td><td class="r"><b>'+money(d.items.reduce((s,i)=>s+i.cant*i.costo,0))+'</b></td><td></td></tr></table></div>':'<div class="empty">Todavía no agregaste renglones</div>')+
  '<div class="bar" style="margin-top:12px"><div class="sp"></div><button class="btn" onclick="newDraft();render()">Descartar</button><button class="btn pri" onclick="confirmarCompra()">Confirmar ingreso</button></div></div>';
};
function lineProdChange(){const p=byId(DB.productos,$('#l_prod').value);if(!p)return;$('#l_costo').value=p.costoRef||'';$('#l_venc').required=p.controlaVenc;$('#l_venc').disabled=!p.controlaVenc&&false}
function addLine(){
  try{
    const pid=Number($('#l_prod').value);if(!pid)throw new Error('Elegí un producto');const p=byId(DB.productos,pid);
    const it={productoId:pid,nro:$('#l_nro').value.trim(),venc:$('#l_venc').value,cant:Number($('#l_cant').value),costo:Number($('#l_costo').value)};
    if(!it.nro)throw new Error('Ingresá el número de lote');if(p.controlaVenc&&!it.venc)throw new Error('Este producto exige fecha de vencimiento');
    if(!(it.cant>0))throw new Error('Cantidad inválida');if(!(it.costo>=0)||$('#l_costo').value==='')throw new Error('Ingresá el costo');
    if(it.venc&&it.venc<draft.fecha)toast('Atención: el lote ya ingresa vencido',true);
    draft.items.push(it);saveDraftFields();render();
  }catch(e){toast(e.message,true)}
}
function saveDraftFields(){}
function confirmarCompra(){try{const c=crearCompra(draft);toast('Compra #'+c.id+' registrada: '+draft.items.length+' lote(s) ingresados');newDraft();tabs.compras='hist';render()}catch(e){toast(e.message,true)}}
function verCompra(id){
  const c=byId(DB.compras,id),pv=byId(DB.proveedores,c.proveedorId);
  openModal('Compra #'+c.id+' · '+c.tipo+' '+c.numero,'<p class="mut">'+esc(pv.razon)+' · '+fdate(c.fecha)+'</p><div class="wrap"><table class="tbl"><tr><th>Producto</th><th>Lote</th><th>Vence</th><th class="r">Cant.</th><th class="r">Costo</th><th></th></tr>'+
   DB.compraItems.filter(i=>i.compraId===id).map(i=>{const p=byId(DB.productos,i.productoId),l=byId(DB.lotes,i.loteId);return'<tr><td>'+esc(p.nombre)+'</td><td>'+esc(l.nro)+'</td><td>'+badgeVenc(l)+'</td><td class="r">'+num(i.cant)+'</td><td class="r">'+money(i.costo)+'</td><td><button type="button" class="btn sm" onclick="closeModal();trazarLote('+l.id+')">Trazar</button></td></tr>'}).join('')+'</table></div><p style="text-align:right"><b>Total '+money(c.total)+'</b></p>');
}

/* ---------- Ventas ---------- */
let ventaQ='',ventaCliente='',ventaMedio='Efectivo';
R.ventas=()=>{
  const sm=stockMap(),q=ventaQ.toLowerCase();
  const res=q?DB.productos.filter(p=>p.activo&&(p.nombre+' '+p.marca+' '+p.codigo).toLowerCase().includes(q)).slice(0,8):[];
  const work={...sm};let total=0;
  const lines=cart.map((it,i)=>{
    const p=byId(DB.productos,it.productoId);let al='',err='';
    try{const a=asignar(it.productoId,it.cant,it.loteId||null,work);al=a.map(x=>{const l=byId(DB.lotes,x.loteId);return esc(l.nro)+' ×'+num(x.cant)+(l.venc?' (vence '+fdate(l.venc)+')':'')}).join(' + ')}catch(e){err=e.message}
    total+=it.cant*it.precio;
    const vend=lotesVendibles(it.productoId,sm);
    return'<tr><td><b>'+esc(p.nombre)+'</b><div class="small '+(err?'':'alloc')+'" '+(err?'style="color:var(--bad)"':'')+'>'+(err?'⚠ '+esc(err):'Saldrá de: '+al)+'</div></td>'+
     '<td><input type="number" min="0.001" step="any" value="'+it.cant+'" style="width:80px" onchange="cart['+i+'].cant=Number(this.value);render()"> '+esc(p.unidad)+'</td>'+
     '<td><select onchange="cart['+i+'].loteId=this.value?Number(this.value):null;render()"><option value="">Auto ('+DB.cfg.criterio+')</option>'+vend.map(l=>'<option value="'+l.id+'"'+(it.loteId===l.id?' selected':'')+'>'+esc(l.nro)+' · '+num(sm[l.id])+' '+(l.venc?'· v. '+fdate(l.venc):'')+'</option>').join('')+'</select></td>'+
     '<td class="r"><input type="number" min="0" step="any" value="'+it.precio+'" style="width:90px" onchange="cart['+i+'].precio=Number(this.value);render()"></td><td class="r">'+money(it.cant*it.precio)+'</td><td class="act"><button class="btn sm danger" onclick="cart.splice('+i+',1);render()">✕</button></td></tr>'});
  return head('Ventas y salidas','Escaneá el código (Enter) o buscá. El stock se descuenta del lote sugerido por '+DB.cfg.criterio+' o del que elijas.')+
  '<div class="card"><input id="vq" autofocus placeholder="📷 Escanear código de barras/QR o escribir nombre… (Enter)" value="'+esc(ventaQ)+'" style="width:100%;font-size:16px;padding:12px" oninput="ventaQ=this.value;ventaSearch()" onkeydown="if(event.key===\'Enter\')ventaEnter()">'+
   '<div id="vres">'+vres(res,sm)+'</div></div>'+
  '<div class="card"><h2>Carrito</h2>'+(cart.length?'<div class="wrap"><table class="tbl"><tr><th>Producto</th><th>Cantidad</th><th>Lote</th><th class="r">Precio</th><th class="r">Subtotal</th><th></th></tr>'+lines.join('')+'</table></div>':'<div class="empty">Escaneá o buscá un producto para empezar</div>')+
  '<div class="bar" style="margin-top:12px"><input placeholder="Cliente (opcional)" value="'+esc(ventaCliente)+'" oninput="ventaCliente=this.value"><select onchange="ventaMedio=this.value">'+['Efectivo','Transferencia','Tarjeta','Cuenta corriente'].map(m=>'<option'+(ventaMedio===m?' selected':'')+'>'+m+'</option>').join('')+'</select><div class="sp"></div><b style="font-size:20px">'+money(total)+'</b><button class="btn" onclick="cart=[];render()">Vaciar</button><button class="btn pri" onclick="confirmarVenta()">Confirmar venta</button></div></div>'+
  '<div class="card"><h2>Últimas ventas</h2><div class="wrap"><table class="tbl"><tr><th>Ticket</th><th>Fecha</th><th>Cliente</th><th>Medio</th><th class="r">Total</th><th></th></tr>'+DB.ventas.slice().reverse().slice(0,10).map(v=>'<tr><td>#'+v.id+'</td><td>'+fdt(v.fecha)+'</td><td>'+esc(v.cliente)+'</td><td>'+esc(v.medio)+'</td><td class="r">'+money(v.total)+'</td><td class="act"><button class="btn sm" onclick="verVenta('+v.id+')">Detalle y lotes</button></td></tr>').join('')+'</table></div></div>';
};
function vres(res,sm){return res.length?'<div style="margin-top:10px;display:grid;gap:6px">'+res.map(p=>{const d=stockDisp(p.id,sm);return'<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 10px;background:var(--panel2);border-radius:8px"><span><b>'+esc(p.nombre)+'</b> <span class="mut small">'+esc(p.codigo)+' · disp. '+num(d)+' '+esc(p.unidad)+'</span></span><button class="btn sm pri" '+(d>0?'':'disabled')+' onclick="addCart('+p.id+')">+ Agregar · '+money(p.precio)+'</button></div>'}).join('')+'</div>':''}
function ventaSearch(){const q=ventaQ.toLowerCase();const sm=stockMap();const res=q?DB.productos.filter(p=>p.activo&&(p.nombre+' '+p.marca+' '+p.codigo).toLowerCase().includes(q)).slice(0,8):[];$('#vres').innerHTML=vres(res,sm)}
function ventaEnter(){
  const q=ventaQ.trim();if(!q)return;
  let p=DB.productos.find(x=>x.activo&&x.codigo===q);
  if(!p){const m=DB.productos.filter(x=>x.activo&&(x.nombre+' '+x.marca).toLowerCase().includes(q.toLowerCase()));if(m.length===1)p=m[0]}
  if(p)addCart(p.id);else toast('No se encontró un único producto para "'+q+'"',true);
}
function addCart(pid){
  const p=byId(DB.productos,pid);const ex=cart.find(c=>c.productoId===pid&&!c.loteId);
  if(ex)ex.cant=r3(ex.cant+1);else cart.push({productoId:pid,cant:1,precio:p.precio,loteId:null});
  ventaQ='';render();const e=$('#vq');if(e)e.focus();
}
function confirmarVenta(){
  try{const v=crearVenta({items:cart,cliente:ventaCliente,medio:ventaMedio});cart=[];ventaCliente='';toast('Venta #'+v.id+' registrada · '+money(v.total));render();verVenta(v.id)}catch(e){toast(e.message,true)}
}
function verVenta(id){
  const v=byId(DB.ventas,id);
  openModal('Ticket #'+v.id,'<p class="mut">'+fdt(v.fecha)+' · '+esc(v.cliente)+' · '+esc(v.medio)+'</p><div class="wrap"><table class="tbl"><tr><th>Producto</th><th class="r">Cant.</th><th class="r">Precio</th><th>Lotes de salida</th></tr>'+
   DB.ventaItems.filter(i=>i.ventaId===id).map(i=>{const p=byId(DB.productos,i.productoId);return'<tr><td>'+esc(p.nombre)+'</td><td class="r">'+num(i.cant)+'</td><td class="r">'+money(i.precio)+'</td><td class="small">'+i.allocs.map(a=>{const l=byId(DB.lotes,a.loteId);return'<a style="color:var(--info);cursor:pointer" onclick="closeModal();trazarLote('+l.id+')">'+esc(l.nro)+'</a> ×'+num(a.cant)}).join('<br>')+'</td></tr>'}).join('')+'</table></div><p style="text-align:right"><b>Total '+money(v.total)+'</b></p>');
}

/* ---------- Ajustes ---------- */
R.ajustes=()=>{
  const movs=DB.movimientos.filter(m=>!['ENTRADA','VENTA'].includes(m.tipo)).sort((a,b)=>b.fecha<a.fecha?-1:b.fecha>a.fecha?1:b.id-a.id);
  return head('Ajustes, mermas y bajas','Salidas de stock que no son ventas. Siempre se descuentan de un lote puntual y exigen motivo.')+
  '<div class="bar"><div class="sp"></div><button class="btn pri" onclick="formAjuste()">+ Registrar ajuste / merma</button></div>'+
  '<div class="card wrap"><table class="tbl"><tr><th>Fecha</th><th>Tipo</th><th>Producto</th><th>Lote</th><th class="r">Cant.</th><th class="r">Valor</th><th>Motivo</th></tr>'+
  (movs.length?movs.map(m=>{const p=byId(DB.productos,m.productoId),l=byId(DB.lotes,m.loteId);return'<tr><td>'+fdt(m.fecha)+'</td><td>'+tipoBadge(m.tipo)+'</td><td>'+esc(p.nombre)+'</td><td>'+esc(l.nro)+'</td><td class="r">'+(m.cant>0?'+':'')+num(m.cant)+'</td><td class="r">'+money(m.cant*m.costo)+'</td><td class="small">'+esc(m.nota)+'</td></tr>'}).join(''):'<tr><td colspan="7" class="empty">Sin ajustes registrados</td></tr>')+'</table></div>';
};
function formAjuste(loteId){
  const sm=stockMap();const ls=DB.lotes.filter(l=>(sm[l.id]||0)>0||l.id===loteId);
  openModal('Registrar ajuste / merma','<div class="form"><label class="full">Lote *<select name="loteId" required><option value="">— elegir —</option>'+ls.map(l=>{const p=byId(DB.productos,l.productoId);return'<option value="'+l.id+'"'+(l.id===loteId?' selected':'')+'>'+esc(p.nombre)+' · lote '+esc(l.nro)+' · stock '+num(sm[l.id]||0)+(estadoVenc(l)==='vencido'?' · VENCIDO':'')+'</option>'}).join('')+'</select></label>'+
   '<label>Tipo<select name="tipo">'+['MERMA','ROTURA','VENCIDO','AJUSTE_NEG','AJUSTE_POS'].map(t=>'<option value="'+t+'">'+TIPOS_MOV[t]+'</option>').join('')+'</select></label><label>Cantidad *<input name="cant" type="number" min="0.001" step="any" required></label><label class="full">Motivo *<input name="nota" required placeholder="Ej.: envase pinchado, conteo físico, derrame…"></label></div>',
   d=>{crearAjuste({loteId:Number(d.loteId),tipo:d.tipo,cant:Number(d.cant),nota:d.nota});toast('Ajuste registrado');render()});
}

/* ---------- Trazabilidad ---------- */
R.trazabilidad=()=>{
  const sm=stockMap();
  const sel='<div class="bar"><select id="tl" style="min-width:320px" onchange="trazLote=Number(this.value)||null;render()"><option value="">— elegir lote —</option>'+DB.lotes.slice().sort((a,b)=>a.productoId-b.productoId||a.id-b.id).map(l=>{const p=byId(DB.productos,l.productoId);return'<option value="'+l.id+'"'+(trazLote===l.id?' selected':'')+'>'+esc(p.nombre)+' · '+esc(l.nro)+'</option>'}).join('')+'</select>'+
   '<input id="tq" placeholder="…o escribí el N° de lote y Enter" onkeydown="if(event.key===\'Enter\')trazBuscar(this.value)"></div>';
  const t=trazLote?trazar(trazLote):null;
  if(!t)return head('Trazabilidad por lote','Del remito de compra a cada salida, con saldo corrido')+sel+'<div class="card empty">Elegí un lote para ver su historia completa</div>';
  const {lote:l,prod:p,prov,compra:c}=t;
  return head('Trazabilidad por lote','Del remito de compra a cada salida, con saldo corrido')+sel+
  '<div class="card"><div class="grid g4"><div><small class="mut">Producto</small><div><b>'+esc(p.nombre)+'</b></div></div><div><small class="mut">Lote</small><div><b>'+esc(l.nro)+'</b></div></div><div><small class="mut">Vencimiento</small><div>'+badgeVenc(l)+'</div></div><div><small class="mut">Stock actual</small><div><b>'+num(t.saldo)+' '+esc(p.unidad)+'</b> de '+num(l.cantInicial)+'</div></div>'+
  '<div><small class="mut">Proveedor</small><div>'+esc(prov.razon)+'</div></div><div><small class="mut">Comprobante</small><div>'+esc(c.tipo)+' '+esc(c.numero)+'</div></div><div><small class="mut">Ingreso</small><div>'+fdate(l.ingreso)+'</div></div><div><small class="mut">Costo unitario</small><div>'+money(l.costo)+'</div></div></div></div>'+
  '<div class="card"><h2>Historia del lote</h2><div class="tl">'+t.movs.map(m=>{
    let det=esc(m.nota);if(m.refTipo==='venta'){const v=byId(DB.ventas,m.refId);if(v)det='<a style="color:var(--info);cursor:pointer" onclick="verVenta('+v.id+')">Ticket #'+v.id+'</a> · '+esc(v.cliente)}
    return'<div class="ev '+(m.cant>0?'in':'neg')+'"><div>'+tipoBadge(m.tipo)+' <b>'+(m.cant>0?'+':'')+num(m.cant)+' '+esc(p.unidad)+'</b> <span class="mut small">· '+fdt(m.fecha)+'</span></div><div class="small mut">'+det+' · saldo del lote: <b style="color:var(--tx)">'+num(m.saldo)+'</b></div></div>'}).join('')+'</div></div>';
};
function trazBuscar(v){v=v.trim().toLowerCase();const m=DB.lotes.filter(l=>l.nro.toLowerCase()===v);if(!m.length)return toast('No existe un lote con ese número',true);if(m.length>1)toast('Hay '+m.length+' productos con ese lote; elegí en la lista');trazLote=m[0].id;render()}

/* ---------- Reportes ---------- */
R.reportes=()=>{
  const t=tabs.reportes;
  const tb='<div class="tabs"><button class="'+(t==='mov'?'on':'')+'" onclick="tabs.reportes=\'mov\';render()">Movimientos por lote</button><button class="'+(t==='val'?'on':'')+'" onclick="tabs.reportes=\'val\';render()">Valorización de stock</button></div>';
  if(t==='val'){
    const v=valorizacion().filter(x=>!flt.val.cat||x.p.categoria===flt.val.cat);const tot=v.reduce((s,x)=>s+x.valor,0);const vv=v.filter(x=>x.estado==='vencido').reduce((s,x)=>s+x.valor,0);
    const porCat={};v.forEach(x=>porCat[x.p.categoria]=(porCat[x.p.categoria]||0)+x.valor);
    return head('Valorización de stock','Stock actual × costo de cada lote (costo real de compra)')+tb+
    '<div class="bar"><select onchange="flt.val.cat=this.value;render()"><option value="">Todas las categorías</option>'+DB.categorias.map(c=>'<option'+(flt.val.cat===c?' selected':'')+'>'+esc(c)+'</option>').join('')+'</select><div class="sp"></div><button class="btn" onclick="expVal()">⬇ Exportar CSV</button><button class="btn" onclick="window.print()">🖨 Imprimir</button></div>'+
    '<div class="grid g4" style="margin-bottom:14px"><div class="kpi ok"><small>Valor total</small><b>'+money(tot)+'</b></div><div class="kpi '+(vv?'bad':'')+'"><small>De lotes vencidos</small><b>'+money(vv)+'</b></div>'+Object.entries(porCat).map(([c,x])=>'<div class="kpi"><small>'+esc(c)+'</small><b style="font-size:18px">'+money(x)+'</b></div>').join('')+'</div>'+
    '<div class="card wrap"><table class="tbl"><tr><th>Producto</th><th>Lote</th><th>Vence</th><th class="r">Stock</th><th class="r">Costo</th><th class="r">Valor</th><th class="r">A precio venta</th></tr>'+
    v.sort((a,b)=>a.p.nombre.localeCompare(b.p.nombre)).map(x=>'<tr><td>'+esc(x.p.nombre)+'</td><td>'+esc(x.l.nro)+'</td><td>'+badgeVenc(x.l)+'</td><td class="r">'+num(x.stock)+' '+esc(x.p.unidad)+'</td><td class="r">'+money(x.l.costo)+'</td><td class="r">'+money(x.valor)+'</td><td class="r">'+money(x.stock*x.p.precio)+'</td></tr>').join('')+
    '<tr><td colspan="5" class="r"><b>Total</b></td><td class="r"><b>'+money(tot)+'</b></td><td class="r"><b>'+money(v.reduce((s,x)=>s+x.stock*x.p.precio,0))+'</b></td></tr></table></div>';
  }
  const f=flt.mov,rows=movFiltrados();
  return head('Reporte de movimientos','Filtrá por fecha, producto, lote o tipo. Es el libro completo de entradas y salidas.')+tb+
  '<div class="bar"><label class="small mut">Desde <input type="date" value="'+f.desde+'" onchange="flt.mov.desde=this.value;render()"></label><label class="small mut">Hasta <input type="date" value="'+f.hasta+'" onchange="flt.mov.hasta=this.value;render()"></label>'+
  '<select onchange="flt.mov.prod=this.value;render()"><option value="">Todos los productos</option>'+DB.productos.map(p=>'<option value="'+p.id+'"'+(String(f.prod)===String(p.id)?' selected':'')+'>'+esc(p.nombre)+'</option>').join('')+'</select>'+
  '<select onchange="flt.mov.tipo=this.value;render()"><option value="">Todos los tipos</option>'+Object.entries(TIPOS_MOV).map(([k,v])=>'<option value="'+k+'"'+(f.tipo===k?' selected':'')+'>'+v+'</option>').join('')+'</select>'+
  '<input id="ml" placeholder="N° de lote" value="'+esc(f.lote)+'" oninput="flt.mov.lote=this.value;rerender(\'reportes\',\'ml\')" style="width:130px"><div class="sp"></div><button class="btn" onclick="expMov()">⬇ Exportar CSV</button><button class="btn" onclick="window.print()">🖨 Imprimir</button></div>'+
  '<div class="card wrap"><table class="tbl"><tr><th>Fecha</th><th>Tipo</th><th>Producto</th><th>Lote</th><th class="r">Cant.</th><th class="r">Valor</th><th>Referencia</th></tr>'+
  (rows.length?rows.map(m=>{const p=byId(DB.productos,m.productoId),l=byId(DB.lotes,m.loteId);return'<tr><td>'+fdt(m.fecha)+'</td><td>'+tipoBadge(m.tipo)+'</td><td>'+esc(p.nombre)+'</td><td><a style="color:var(--info);cursor:pointer" onclick="trazarLote('+l.id+')">'+esc(l.nro)+'</a></td><td class="r">'+(m.cant>0?'+':'')+num(m.cant)+'</td><td class="r">'+money(m.cant*m.costo)+'</td><td class="small">'+esc(m.nota)+'</td></tr>'}).join(''):'<tr><td colspan="7" class="empty">Sin movimientos para ese filtro</td></tr>')+'</table></div><p class="mut small">'+rows.length+' movimientos · entradas '+num(rows.filter(m=>m.cant>0).reduce((s,m)=>s+m.cant,0))+' · salidas '+num(-rows.filter(m=>m.cant<0).reduce((s,m)=>s+m.cant,0))+'</p>';
};
function movFiltrados(){
  const f=flt.mov;
  return DB.movimientos.filter(m=>{const l=byId(DB.lotes,m.loteId);return(!f.desde||m.fecha.slice(0,10)>=f.desde)&&(!f.hasta||m.fecha.slice(0,10)<=f.hasta)&&(!f.prod||m.productoId===Number(f.prod))&&(!f.tipo||m.tipo===f.tipo)&&(!f.lote||l.nro.toLowerCase().includes(f.lote.toLowerCase()))}).sort((a,b)=>b.fecha<a.fecha?-1:b.fecha>a.fecha?1:b.id-a.id);
}
function expMov(){downloadCsv('movimientos_lubricentro_maxi.csv',['Fecha','Tipo','Producto','Lote','Cantidad','Costo unit.','Valor','Referencia'],movFiltrados().map(m=>[fdt(m.fecha),TIPOS_MOV[m.tipo],byId(DB.productos,m.productoId).nombre,byId(DB.lotes,m.loteId).nro,m.cant,m.costo,r3(m.cant*m.costo),m.nota]))}
function expVal(){downloadCsv('valorizacion_lubricentro_maxi.csv',['Producto','Categoría','Lote','Vencimiento','Stock','Costo','Valor'],valorizacion().map(x=>[x.p.nombre,x.p.categoria,x.l.nro,x.l.venc,x.stock,x.l.costo,x.valor]))}

/* ---------- Configuración ---------- */
function openConfig(){
  openModal('Configuración','<div class="form"><label>Criterio de salida<select name="criterio"><option value="FEFO"'+(DB.cfg.criterio==='FEFO'?' selected':'')+'>FEFO · primero el que vence antes</option><option value="FIFO"'+(DB.cfg.criterio==='FIFO'?' selected':'')+'>FIFO · primero el que entró antes</option></select></label><label>Alertar vencimientos a (días)<input name="diasAlerta" type="number" min="1" value="'+DB.cfg.diasAlerta+'"></label></div>'+
   '<hr style="border-color:var(--line);margin:18px 0"><div class="bar"><button type="button" class="btn" onclick="exportJson()">⬇ Respaldo (JSON)</button><label class="btn">⬆ Restaurar<input type="file" accept=".json" hidden onchange="importJson(this.files[0])"></label><button type="button" class="btn danger" onclick="if(confirm(\'Se borran los cambios y se vuelve a los datos de ejemplo. ¿Seguir?\')){closeModal();seed();cart=[];draft=null;render();toast(\'Datos de demo restablecidos\')}">Restablecer datos de demo</button></div><p class="mut small">Demo: los datos viven sólo en este navegador (localStorage).</p>',
   d=>{DB.cfg.criterio=d.criterio;DB.cfg.diasAlerta=Math.max(1,Number(d.diasAlerta)||60);save();toast('Configuración guardada');render()});
}
function exportJson(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(DB)],{type:'application/json'}));a.download='lubricentro_maxi_respaldo_'+hoy()+'.json';a.click()}
function importJson(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.productos||!d.lotes||!d.movimientos)throw 0;DB=d;save();closeModal();render();toast('Respaldo restaurado')}catch(e){toast('Archivo inválido',true)}};r.readAsText(f)}

/* ---------- arranque ---------- */
load();
{const h=location.hash.slice(1);if(VIEWS.some(x=>x[0]===h))view=h}
render();
</script>
</body>
